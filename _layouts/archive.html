---
layout: default
title: Archive
---

<section class="category-archive">
    <div class="category-archive__header">
        <a href="{{ site.baseurl }}/categories" class="category-archive__back">&larr; All categories</a>
        <h1 class="category-archive__title">{{ page.title }}</h1>
        <p class="category-archive__count">{{ page.posts.size }} article{% if page.posts.size != 1 %}s{% endif %}</p>
    </div>

    <div class="row listrecent">
        {% for post in page.posts %}
            {% include postbox.html %}
        {% endfor %}
    </div>
</section>
