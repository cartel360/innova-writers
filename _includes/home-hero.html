<section class="home-hero">
    <div class="home-hero__glow" aria-hidden="true"></div>
    <div class="container">
        <div class="home-hero__inner text-center">
            <div class="home-hero__team">
                <div class="team-members">
                    {% for member in site.data.team %}
                    <div class="team-member-wrapper">
                        <a href="{{ member.link }}" class="team-member" data-name="{{ member.name }}">
                            <img src="{{ member.image }}" alt="{{ member.name }}" class="member-photo">
                        </a>
                    </div>
                    {% endfor %}
                </div>
                <p class="home-hero__team-label">Meet the people who make it all happen</p>
            </div>

            <h1 class="hero-title">Believe, Innovate, Create</h1>
            <p class="hero-description">
                Curious minds exploring software, data, finance, and the ideas shaping how we build the future.
            </p>

            <div class="home-hero__actions">
                <a href="#articles" class="btn btn-hero btn-hero--primary">Browse articles</a>
                <a href="{{ site.baseurl }}/authors" class="btn btn-hero btn-hero--ghost">Meet authors</a>
            </div>

            <div class="home-hero__search">
                {% include search-form.html %}
            </div>
        </div>
    </div>
</section>
