<div class="search-section {% if include.compact %}search-section--compact{% endif %}">
    <form class="bd-search" onSubmit="return lunr_search(document.getElementById('lunrsearch').value);">
        <div class="input-group">
            <input type="search" class="form-control text-small" id="lunrsearch" name="q" maxlength="255"
                placeholder="Search articles..." autocomplete="off" aria-label="Search articles" />
            <button type="submit" class="search-icon-btn" aria-label="Search">
                <i class="fa fa-search search-icon"></i>
            </button>
        </div>
        <div id="lunrsearchresults" role="listbox" aria-label="Search results">
            <ul></ul>
        </div>
    </form>
</div>
